# Replaces the base image's default.conf rather than editing it, because the
# entrypoint's sed pass over that file is skipped on a read-only root
# filesystem — anything this site needs has to already be in the file.

server {
    # 8080, not 80. The Deployment runs this as uid 10001, and a process
    # without CAP_NET_BIND_SERVICE cannot bind a port below 1024: nginx exits
    # with "bind() to 0.0.0.0:80 failed (13: Permission denied)" before it
    # serves anything.
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # The build emits directory-style routes (/autohospedaje/index.html), so a
    # request for /autohospedaje without the slash has to be redirected rather
    # than 404'd. Relative, because absolute would send the client to
    # http://<pod-ip>:8080 — nginx does not know it is behind the ingress.
    absolute_redirect off;

    # Hides the exact nginx version from every response and from the default
    # error pages. It does not stop anyone determined, but it keeps the image's
    # patch level out of the trivial-scan results.
    server_tokens off;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Everything under /_astro/ carries a content hash in its filename, so the
    # URL changes whenever the bytes do. Caching it for a year is safe and is
    # the whole point of the hash.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The HTML is what points at those hashed URLs, so it must not be cached or
    # a returning visitor keeps loading the previous deploy's asset names long
    # after they stopped existing.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~ /index\.html$ {
        add_header Cache-Control "no-cache";
    }
}
