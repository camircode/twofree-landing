# Builds the image, tests and scans it, pushes it to GHCR by digest, and commits
# that digest to camircode/gitops. Argo CD does the deploying; this workflow never
# touches the cluster, so the git log of camircode/gitops stays the real
# deployment history.
#
# This replaces the Jenkinsfile that did the same job on the homelab's Jenkins,
# stage for stage. The shell in each step was moved over unchanged.
#
# Pull requests run only the first step. They get no secrets (GitHub withholds
# them from forks), so nothing that publishes or deploys can run from one, and
# `pull_request_target` is deliberately not used. Only a push to main updates
# gitops; a push to ci/** goes as far as the scan, which is how a change to this
# file gets tried without deploying anything.
name: ci

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# disableConcurrentBuilds in the Jenkinsfile: queue, never cancel a build that
# may be halfway through publishing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: 'ghcr.io'
  IMAGE: 'ghcr.io/camircode/twofree-landing'
  GITOPS: 'git@github.com:camircode/gitops.git'
  MANIFEST: 'manifests/twofree-landing/deployment.yaml'
  PUBLIC_SITE_URL: 'https://2free.camir.tech'
  PUBLIC_WEB_URL: 'https://2free.camir.tech/app'
  PUBLIC_SOURCE_URL: 'https://github.com/camircode/2free'
  PUBLIC_GITHUB_REPOSITORY: 'camircode/2free'

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: |
          set -eu

          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -e HOME=/tmp -e CI=true \
            -e PUBLIC_SITE_URL -e PUBLIC_WEB_URL \
            -e PUBLIC_SOURCE_URL -e PUBLIC_GITHUB_REPOSITORY \
            -v "$PWD":/src -w /src \
            node:24 \
            sh -c '
              set -eu
              mkdir -p /tmp/bin
              corepack enable --install-directory /tmp/bin
              export PATH=/tmp/bin:$PATH
              pnpm install --frozen-lockfile
              pnpm check
              pnpm build
            '


      - name: Compute build metadata
        if: github.event_name != 'pull_request'
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build and push
        if: github.event_name != 'pull_request'
        env:
          GHCR_USER: ${{ secrets.GHCR_USERNAME }}
          GHCR_PASS: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -eu
          echo "$GHCR_PASS" | docker login "$REGISTRY" -u "$GHCR_USER" --password-stdin

          docker buildx create --use --name builder 2>/dev/null || docker buildx use builder

          # The tag exists so a human can find the build; the digest
          # is what gets deployed. --metadata-file is how the digest
          # comes back without a second registry round trip.
          #
          # --build-arg and not --secret: these are public values
          # that Astro inlines into the shipped HTML, so hiding them
          # from the image history would protect nothing and only
          # make the build harder to reproduce.
          docker buildx build \
            --push \
            --provenance=false \
            --build-arg "PUBLIC_SITE_URL=$PUBLIC_SITE_URL" \
            --build-arg "PUBLIC_WEB_URL=$PUBLIC_WEB_URL" \
            --build-arg "PUBLIC_SOURCE_URL=$PUBLIC_SOURCE_URL" \
            --build-arg "PUBLIC_GITHUB_REPOSITORY=$PUBLIC_GITHUB_REPOSITORY" \
            --tag "$IMAGE:$SHORT_SHA" \
            --metadata-file metadata.json \
            .


      - name: Record the image digest
        if: github.event_name != 'pull_request'
        run: |
          digest="$(jq -r '."containerimage.digest"' metadata.json)"
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "Pushed ${IMAGE}@${digest}"

      - name: Smoke test
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          NET="smoke-$GITHUB_RUN_NUMBER"
          APP="smoke-landing-$GITHUB_RUN_NUMBER"

          cleanup() {
            docker logs "$APP" 2>&1 | tail -30 || true
            docker rm -f "$APP" >/dev/null 2>&1 || true
            docker network rm "$NET" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$NET"

          docker pull "${IMAGE}@${IMAGE_DIGEST}"
          docker run -d --name "$APP" --network "$NET" \
            --user 10001:10001 --read-only --tmpfs /tmp \
            "${IMAGE}@${IMAGE_DIGEST}"

          # curl from a container on the same network: the agent needs
          # neither curl installed nor a published port.
          probe() {
            docker run --rm --network "$NET" curlimages/curl:latest \
              -sS -o /dev/null -w '%{http_code}' --max-time 5 "http://$APP:8080$1"
          }

          ok=""
          for i in $(seq 1 30); do
            if [ "$(probe / || true)" = "200" ]; then ok=yes; break; fi
            sleep 2
          done
          [ -n "$ok" ] || { echo "The image never answered on / at port 8080."; exit 1; }

          # A second route, because / would still answer 200 from the
          # base image's own index.html if the COPY of dist had gone
          # to the wrong path. /autohospedaje/ only exists if this
          # site's build is what is being served.
          [ "$(probe /autohospedaje/)" = "200" ] || { echo "/autohospedaje/ did not answer 200; dist may not be what is being served."; exit 1; }

          echo "Smoke test passed: the image starts as 10001 on a read-only filesystem and serves the site."


      - name: Scan
        if: github.event_name != 'pull_request'
        env:
          GHCR_USER: ${{ secrets.GHCR_USERNAME }}
          GHCR_PASS: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -eu
          docker run --rm \
            -e TRIVY_USERNAME="$GHCR_USER" \
            -e TRIVY_PASSWORD="$GHCR_PASS" \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            -v "$PWD/.trivyignore.yaml:/.trivyignore.yaml:ro" \
            aquasec/trivy:latest image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --ignorefile /.trivyignore.yaml \
              --exit-code 1 \
              "${IMAGE}@${IMAGE_DIGEST}"


      - name: Update the desired state
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITOPS_DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
        run: |
          set -eu
          # The one credential here that can change what runs in the cluster without a
          # human merging something. It is a deploy key on camircode/gitops alone.
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$GITOPS_DEPLOY_KEY" > "$HOME/.ssh/gitops"
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/gitops -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          rm -rf gitops
          git clone --depth 1 "$GITOPS" gitops
          cd gitops
          git config user.email "ci@camir.tech"
          git config user.name  "github-actions"

          sed -i -E "s#image: ghcr\.io/camircode/twofree-landing[@:][^[:space:]]+#image: ${IMAGE}@${IMAGE_DIGEST}#" "$MANIFEST"

          if git diff --quiet; then
            echo "Already at ${IMAGE_DIGEST}; nothing to commit."
            exit 0
          fi

          git add "$MANIFEST"
          git commit -m "deploy(twofree-landing): ${IMAGE_DIGEST}

          Built from camircode/twofree-landing@${GITHUB_SHA} by GitHub Actions run ${GITHUB_RUN_ID}."

          # Every application pushes to this one repository, so two builds finishing
          # together will race. Their manifests are different files, so rebasing never
          # conflicts; it only has to be done.
          for attempt in 1 2 3 4 5; do
            git push origin main && exit 0
            echo "push rejected (attempt $attempt); rebasing onto the new tip"
            git fetch --depth 1 origin main
            git rebase origin/main
          done
          echo "could not push to gitops after 5 attempts" >&2
          exit 1

      - name: Clean up credentials
        if: always()
        run: |
          docker logout ghcr.io || true
